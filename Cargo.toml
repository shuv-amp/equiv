[workspace]
resolver = "2"
members = ["crates/equiv-core", "crates/equiv-gate", "crates/equiv-probe", "crates/equiv-harness"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shuv-amp/equiv"

[workspace.dependencies]
equiv-core = { path = "crates/equiv-core" }
equiv-gate = { path = "crates/equiv-gate" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
sha2 = "0.10"

[profile.release]
opt-level = 2
